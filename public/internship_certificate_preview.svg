<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="20" fill="url(#paperGrad)"/>

  <!-- Ornate Border -->
  <rect x="18" y="18" width="764" height="524" rx="14" fill="none" stroke="url(#goldBorder)" stroke-width="2" opacity="0.7"/>
  <rect x="28" y="28" width="744" height="504" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Corner Ornaments -->
  <g stroke="url(#goldBorder)" stroke-width="2" fill="none">
    <path d="M 38 60 L 38 38 L 60 38" />
    <circle cx="38" cy="38" r="3" fill="#F59E0B"/>
    <path d="M 762 60 L 762 38 L 740 38" />
    <circle cx="762" cy="38" r="3" fill="#F59E0B"/>
    <path d="M 38 500 L 38 522 L 60 522" />
    <circle cx="38" cy="522" r="3" fill="#F59E0B"/>
    <path d="M 762 500 L 762 522 L 740 522" />
    <circle cx="762" cy="522" r="3" fill="#F59E0B"/>
  </g>

  <!-- Top Badges / Organization Header -->
  <g transform="translate(60, 55)">
    <!-- Virtusa Brand Crest -->
    <rect x="0" y="0" width="130" height="34" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="65" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="1.5">VIRTUSA</text>

    <!-- Client: BT Badge -->
    <rect x="142" y="0" width="200" height="34" rx="6" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
    <text x="242" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#22D3EE" text-anchor="middle" letter-spacing="0.5">CLIENT: BRITISH TELECOM</text>

    <!-- Status / Document ID -->
    <text x="680" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="end">DOC ID: 23BIT0436-INTERN-2026</text>
  </g>

  <!-- Main Certificate Headings -->
  <text x="400" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B" font-weight="700" letter-spacing="3" text-anchor="middle">OFFICIAL COMPLETION &amp; INDUSTRIAL TRAINING CREDENTIAL</text>
  <text x="400" y="180" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">CERTIFICATE OF INTERNSHIP</text>
  <line x1="260" y1="195" x2="540" y2="195" stroke="url(#cyanAccent)" stroke-width="2"/>

  <text x="400" y="230" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">This is to certify that</text>
  <text x="400" y="275" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#goldBorder)" text-anchor="middle" letter-spacing="1">RAGHAV GOYAL</text>
  <text x="400" y="302" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22D3EE" text-anchor="middle">Registration No: 23BIT0436 · VIT Vellore</text>

  <!-- Internship Body Statement -->
  <g transform="translate(400, 340)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.85)" text-anchor="middle">has successfully completed the Industrial Internship as a <tspan fill="#FFFFFF" font-weight="700">Digital Engineer Intern</tspan></text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="13.5" fill="rgba(255,255,255,0.7)" text-anchor="middle">working on <tspan fill="#A5B4FC" font-weight="600">Enterprise AI/ML Implementation &amp; Production Architecture</tspan> for <tspan fill="#22D3EE" font-weight="600">British Telecom (BT)</tspan></text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="12.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">Duration: June 2026 – August 2026 · Location: Enterprise AI Division, Virtusa Consulting Services</text>
  </g>

  <!-- Gold Seal / Hologram Graphic -->
  <g transform="translate(130, 445)">
    <circle cx="28" cy="28" r="28" fill="url(#goldBorder)" opacity="0.9"/>
    <circle cx="28" cy="28" r="24" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="28" y="24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" fill="#FCD34D" text-anchor="middle">VERIFIED</text>
    <text x="28" y="36" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FCD34D" text-anchor="middle">OFFICIAL</text>
  </g>

  <!-- Signatures & Credentials Verification Row -->
  <g transform="translate(250, 460)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">ENTERPRISE GENERATIVE AI</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.5)">Oracle Cloud Infrastructure · 94% Pass</text>
  </g>

  <g transform="translate(560, 460)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22D3EE">VIRTUSA &amp; BT VERIFIED</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.5)">Full Report: 46 Pages Submitted</text>
  </g>
</svg>
